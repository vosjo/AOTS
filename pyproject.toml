[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"analysis/auxil/**" = ["F401", "F403", "E722", "F841"]
"analysis/models/**" = ["F401", "F403"]
"scripts/**" = ["E722", "F401", "F841"]
"stars/auxil.py" = ["E722", "F401", "F841"]
"observations/auxil/**" = ["E722", "F401"]
"users/views.py" = ["E722", "F401"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "AOTS.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
testpaths = ["AOTS", "stars", "analysis", "observations", "users"]
pythonpath = ["."]
addopts = "-ra"

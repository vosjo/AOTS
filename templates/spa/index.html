{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="{% static 'favicon.ico' %}" />
  <title>AOTS</title>
  <script nonce="{{ request.csp_nonce }}">
    (function () {
      try {
        var theme = localStorage.getItem('aots-theme');
        document.documentElement.setAttribute('data-theme', theme === 'light' ? 'light' : 'dark');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
    window.__AOTS_BOOTSTRAP__ = {
      csrfToken: '{{ csrf_token }}',
      testInstallation: {{ test_installation|yesno:"true,false" }},
      routerBase: '{{ router_base }}',
    };
  </script>
  {% if vite_dev %}
  <script type="module" src="http://localhost:5173/app/@vite/client"></script>
  <script type="module" src="http://localhost:5173/app/src/main.ts"></script>
  {% else %}
  <link rel="stylesheet" href="{% static 'dist/assets/index.css' %}" />
  <script type="module" src="{% static 'dist/assets/index.js' %}"></script>
  {% endif %}
</head>
<body>
  <div id="app"></div>
</body>
</html>

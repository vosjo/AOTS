<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>AOTS – Wartung</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --accent: #1d4ed8;
      --border: #e2e8f0;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card: #1e293b;
        --text: #f1f5f9;
        --muted: #94a3b8;
        --accent: #60a5fa;
        --border: #334155;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
    }
    main {
      max-width: 28rem;
      width: 100%;
      padding: 2rem;
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      background: var(--card);
      box-shadow: 0 1px 3px rgb(15 23 42 / 0.08);
    }
    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.25rem;
      font-weight: 600;
    }
    p {
      margin: 0;
      color: var(--muted);
    }
    .brand {
      margin-bottom: 1.25rem;
      font-size: 0.875rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">AOTS</div>
    <h1>Vorübergehend nicht erreichbar</h1>
    <p>
      Wir rollen gerade eine neue Version aus. Bitte versuchen Sie es in ein paar Minuten erneut.
    </p>
  </main>
</body>
</html>
